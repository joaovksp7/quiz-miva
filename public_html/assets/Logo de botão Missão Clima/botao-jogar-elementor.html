<style>
  .mc-botao {
    display: flex;
    justify-content: center;
    width: 100%;
    padding: 12px;
    font-family: 'Nunito', system-ui, sans-serif;
  }
  .mc-botao, .mc-botao *, .mc-botao *::before, .mc-botao *::after { box-sizing: border-box; }
  .mc-botao a.mc-botao-link {
    display: block;
    width: 100%;
    max-width: 340px;
    margin: 0;
    border-radius: 22px;
    overflow: hidden;
    background: #0f2138;
    color: #ffffff;
    text-decoration: none;
    cursor: pointer;
    box-shadow: 0 14px 32px rgba(0,0,0,.55), 0 0 0 3px #12263f, 0 0 0 6px rgba(138,198,63,.35);
    transform: translateY(0);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .mc-botao a.mc-botao-link:hover {
    transform: translateY(-3px);
    box-shadow: 0 20px 42px rgba(0,0,0,.6), 0 0 0 3px #12263f, 0 0 0 7px rgba(138,198,63,.7);
  }
  .mc-botao a.mc-botao-link:active {
    transform: translateY(2px);
    box-shadow: 0 8px 20px rgba(0,0,0,.5), 0 0 0 3px #12263f, 0 0 0 6px rgba(138,198,63,.5);
  }
  .mc-botao a.mc-botao-link:focus { outline: none; }
  .mc-botao a.mc-botao-link:focus-visible {
    outline: 4px solid #ffd21f;
    outline-offset: 8px;
  }
  .mc-botao .mc-botao-capa {
    position: relative;
    aspect-ratio: 1402 / 854;
    background: #12263f;
  }
  .mc-botao .mc-botao-capa img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    max-width: none;
    margin: 0;
    border: 0;
    border-radius: 0;
    box-shadow: none;
    object-fit: cover;
    display: block;
  }
  .mc-botao .mc-botao-capa::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(13,27,46,0) 72%, rgba(13,27,46,.55) 100%);
  }
  .mc-botao .mc-botao-barra {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 16px;
    background: linear-gradient(180deg, #12263f, #0c1b2d);
  }
  .mc-botao .mc-botao-play {
    position: relative;
    flex: 0 0 auto;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(180deg, #a8dc5e, #6fae32);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 5px 0 #3f6d1c, 0 8px 16px rgba(0,0,0,.45);
  }
  .mc-botao .mc-botao-anel {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid #8cc63f;
    animation: mc-pulseRing 2.2s ease-out infinite;
  }
  .mc-botao .mc-botao-play svg { margin-left: 3px; }
  .mc-botao .mc-botao-textos {
    display: flex;
    flex-direction: column;
    gap: 2px;
    text-align: left;
    min-width: 0;
  }
  .mc-botao .mc-botao-cta {
    font-family: 'Baloo 2', system-ui, sans-serif;
    font-size: 20px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.05;
    letter-spacing: .01em;
  }
  .mc-botao .mc-botao-apoio {
    font-size: 12px;
    font-weight: 700;
    color: #cfe3a8;
    line-height: 1.3;
  }
  .mc-botao .mc-botao-seta {
    margin-left: auto;
    font-size: 18px;
    color: #8cc63f;
    animation: mc-floatLeaf 3.4s ease-in-out infinite;
  }
  @keyframes mc-pulseRing {
    0% { transform: scale(1); opacity: .55; }
    70% { transform: scale(1.35); opacity: 0; }
    100% { transform: scale(1.35); opacity: 0; }
  }
  @keyframes mc-floatLeaf {
    0%, 100% { transform: translateY(0) rotate(-8deg); }
    50% { transform: translateY(-6px) rotate(6deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .mc-botao a.mc-botao-link { transition: none; }
    .mc-botao a.mc-botao-link:hover,
    .mc-botao a.mc-botao-link:active { transform: none; }
    .mc-botao .mc-botao-anel,
    .mc-botao .mc-botao-seta { animation: none; }
  }
</style>

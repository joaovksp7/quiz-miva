<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #0d1b2e; }
  a { color: #8cc63f; }
  a:hover { color: #a8dc5e; }
  @keyframes pulseRing { 0% { transform: scale(1); opacity: .55; } 70% { transform: scale(1.35); opacity: 0; } 100% { transform: scale(1.35); opacity: 0; } }
  @keyframes floatLeaf { 0%,100% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(-6px) rotate(6deg); } }
</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 24px;background:radial-gradient(120% 90% at 50% 0%,#1b3a5c 0%,#0d1b2e 70%);font-family:'Nunito',system-ui,sans-serif;box-sizing:border-box">
  <button type="button" onClick="{{ onPlay }}" style="all:unset;cursor:pointer;display:block;width:100%;max-width:460px;border-radius:28px;overflow:hidden;background:#0f2138;box-shadow:0 18px 44px rgba(0,0,0,.55),0 0 0 4px #12263f,0 0 0 8px rgba(138,198,63,.35);transform:translateY(0);transition:transform .18s ease,box-shadow .18s ease" style-hover="transform:translateY(-4px);box-shadow:0 26px 56px rgba(0,0,0,.6),0 0 0 4px #12263f,0 0 0 9px rgba(138,198,63,.7)" style-active="transform:translateY(2px);box-shadow:0 10px 26px rgba(0,0,0,.5),0 0 0 4px #12263f,0 0 0 8px rgba(138,198,63,.5)">
    <div style="position:relative;aspect-ratio:1402/854;background:#12263f">
      <img src="uploads/capa.webp" alt="Missão Clima: enchentes e deslizamentos" style="width:100%;height:100%;object-fit:cover;display:block" />
      <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,27,46,0) 72%,rgba(13,27,46,.55) 100%)"></div>
    </div>
    <div style="display:flex;align-items:center;gap:16px;padding:18px 22px;background:linear-gradient(180deg,#12263f,#0c1b2d)">
      <div style="position:relative;flex:0 0 auto;width:56px;height:56px;border-radius:50%;background:linear-gradient(180deg,#a8dc5e,#6fae32);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 #3f6d1c,0 10px 20px rgba(0,0,0,.45)">
        <span style="position:absolute;inset:0;border-radius:50%;border:3px solid #8cc63f;animation:pulseRing 2.2s ease-out infinite"></span>
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" style="margin-left:4px">
          <path d="M6 3.5 20 12 6 20.5z" fill="#12263f" />
        </svg>
      </div>
      <div style="display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0">
        <span style="font-family:'Baloo 2',system-ui,sans-serif;font-size:24px;font-weight:800;color:#ffffff;line-height:1.05;letter-spacing:.01em">{{ cta }}</span>
        <span style="font-size:13px;font-weight:700;color:#cfe3a8;line-height:1.3">{{ support }}</span>
      </div>
      <span style="margin-left:auto;font-size:22px;color:#8cc63f;animation:floatLeaf 3.4s ease-in-out infinite">›</span>
    </div>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:520},&quot;cta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;JOGAR AGORA&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;support&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;O conhecimento te prepara!&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onPlay&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      cta: this.props.cta ?? "JOGAR AGORA",
      support: this.props.support ?? "O conhecimento te prepara!",
      onPlay: () => {
        if (this.props.onPlay) this.props.onPlay();
      }
    };
  }
}
</script>
</body>
</html>
